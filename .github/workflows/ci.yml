name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  # Lets deploy.yml gate a production release on this same suite instead of
  # maintaining a second copy of it.
  workflow_call:

permissions:
  contents: read

jobs:
  email-verification-contract:
    name: Email verification queue contract (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cursor_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Restore the reviewed production-compatible baseline
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          CURSOR_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-prospect-cursor-migration.mjs
      - name: Install isolated verification worker test dependency
        run: npm ci --prefix worker --ignore-scripts
      - name: Verify durable verification behavior and restricted grants
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          VERIFICATION_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-email-verification-migration.mjs
      - name: Verify source-first recent batches and restricted grants
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          RECENT_BATCHES_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-client-recent-batches-migration.mjs

  cursor-migration-contract:
    name: People cursor schema-upgrade contract (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cursor_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Restore reviewed baseline and verify cursor upgrade
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          CURSOR_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-prospect-cursor-migration.mjs

  incomplete-info-contract:
    name: Incomplete Info client partition contract (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cursor_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Restore the reviewed production-compatible baseline
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          CURSOR_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-prospect-cursor-migration.mjs
      - name: Verify client partition, pushes, enrichment and restricted grants
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          INCOMPLETE_INFO_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-incomplete-info-migration.mjs

  production-hardening-contract:
    name: Production hardening forward-migration contract (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cursor_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Restore reviewed schema-only baseline and cursor contract
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          CURSOR_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-prospect-cursor-migration.mjs
      - name: Replay additive chain and verify client-summary parity
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cursor_migration_test
          PRODUCTION_HARDENING_MIGRATION_TEST_ALLOW: "1"
        run: node scripts/test-production-hardening-migrations.mjs

  atomic-unit-contract:
    name: PostgreSQL atomic worker contract (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: atomic_unit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Verify atomic checkpoint and failure contracts
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/atomic_unit_test
          ATOMIC_UNIT_TEST_ALLOW: "1"
        run: node scripts/test-atomic-unit.mjs
      - name: Verify bounded cleanup and durable background metrics
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/atomic_unit_test
          ATOMIC_UNIT_TEST_ALLOW: "1"
        run: node scripts/test-background-lifecycle.mjs
      - name: Verify private integration connections and job ledger
        env:
          DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/atomic_unit_test
          ATOMIC_UNIT_TEST_ALLOW: "1"
        run: node scripts/test-integration-sql.mjs

  quality:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Backup receipt behavior
        run: bash scripts/test-backup-snapshot-json.sh

  deterministic-browser-contract:
    name: Deterministic responsive browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Install isolated browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify mobile focus and real theme behavior
        env:
          E2E_FIXTURE_SUITE: "1"
        run: npm run test:e2e -- mobile-nav-fixture

  migration-guard:
    name: Migration guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Validate migration ordering and SECURITY DEFINER revokes
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MIGRATION_PENDING_BRANCH: ${{ startsWith(github.ref, 'refs/heads/codex/') && '1' || '0' }}
        run: node .github/scripts/check-migrations.mjs --base "$MIGRATION_BASE_SHA"
