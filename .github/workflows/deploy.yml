name: Deploy

# Builds the production image on GitHub's runners and deploys it to the VPS.
# The VPS never compiles anything: `next build` on 2 vCPU would compete with
# PostgreSQL for the same cores, and a broken build must not be able to take
# the running app down.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and push the image, but do not deploy it"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Reuse the existing quality gate rather than duplicating it here.
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          # These are compiled into the client bundle. They are public values —
          # the anon key grants nothing, because every table has RLS enabled
          # with no policies and no grants to anon.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to VPS
    needs: build
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Install SSH key
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not ssh-keyscan: keyscan trusts whatever answers,
          # which defeats the point of checking.
          echo "${{ secrets.VPS_SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          deploy_remote() {
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=2 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=4 \
              "${USER}@${HOST}" bash -s -- "${IMAGE}" "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          image="$1"
          expected_version="$2"
          cd /opt/prospect
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cd deploy
          ./scripts/update.sh "$image" "$expected_version"
          REMOTE
          }

          # GitHub-hosted runners and the VPS are separated by the public
          # internet. A short routing interruption must not fail an otherwise
          # safe release. The server-side deployment lock makes a retry safe if
          # the earlier SSH client disconnected while its command kept running.
          status=1
          for attempt in 1 2 3 4; do
            echo "SSH deployment attempt ${attempt}/4"
            if deploy_remote; then
              status=0
              break
            else
              status=$?
            fi
            # 255 is SSH transport failure. Any other status came from the
            # deployment itself and should fail once with its original logs,
            # not repeat migrations or health checks four times.
            if [ "$status" -ne 255 ]; then
              echo "Remote deployment failed with ${status}; not retrying a deterministic error."
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 15))
              echo "SSH attempt failed with ${status}; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit "$status"

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # A 200 on its own proves *a* container answered, not that it is the
          # one this run just shipped — an old container returns 200 just as
          # readily. Check X-App-Version (set from the git SHA at image build
          # time, see Dockerfile and next.config.ts) so a stale rollout fails
          # loudly here instead of shipping green while serving old code.
          for i in $(seq 1 10); do
            headers=$(curl -s -D - -o /dev/null "${{ secrets.APP_PUBLIC_URL }}/api/health" || true)
            code=$(printf '%s' "$headers" | head -1 | grep -o '[0-9]\{3\}' || echo 000)
            version=$(printf '%s' "$headers" | grep -i '^x-app-version:' | tr -d '\r' | cut -d' ' -f2)
            if [ "$code" = "200" ] && [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Application and backend are serving version ${version}."
              exit 0
            fi
            echo "attempt $i: HTTP ${code:-000}, X-App-Version=${version:-<none>} (want ${EXPECTED_VERSION})"
            sleep 10
          done
          echo "Never saw HTTP 200 with X-App-Version=${EXPECTED_VERSION}." >&2
          echo "The new image was pushed but the running container is not serving it." >&2
          exit 1
