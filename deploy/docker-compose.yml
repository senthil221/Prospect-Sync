name: prospect

# Lean self-hosted Supabase + Prospect Sync, sized for a 2 vCPU / 8 GB VPS.
#
# Default `docker compose up -d` starts only what Prospect Sync uses today:
#   db, auth, rest, storage, meta, studio, import-worker, app-router, caddy
# The application is deployed as one of two profiled services (app-blue or
# app-green) by scripts/update.sh. Keeping the inactive slot out of the default
# profile prevents a plain `docker compose up -d` from consuming extra RAM.
#
# Optional services are behind Compose profiles. Turn them on by editing
# COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=storage,realtime,functions).
#
# NOTE: every container port is bound to 127.0.0.1 on purpose. Docker writes its
# own iptables rules and BYPASSES ufw, so a plain "8000:8000" would be exposed to
# the whole internet regardless of your firewall. Only Caddy publishes 80/443.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

x-app: &app
  image: ${APP_IMAGE}
  <<: [*default-restart]
  logging: *default-logging
  depends_on:
    db: { condition: service_healthy }
    auth: { condition: service_healthy }
    rest: { condition: service_started }
    storage: { condition: service_started }
  environment:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_TELEMETRY_DISABLED: "1"
    # Must match the value baked in at build time (see .github/workflows/deploy.yml).
    NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    SUPABASE_STORAGE_URL: http://storage:5000
    IMPORT_WORKER_HEALTH_URL: http://import-worker:9090/health
    ALLOWED_USER_EMAILS: ${ALLOWED_USER_EMAILS}
    # Node heap ceiling so a runaway CSV import cannot OOM the whole box.
    NODE_OPTIONS: "--max-old-space-size=1024"
  healthcheck:
    # Readiness covers Next.js, GoTrue, PostgREST/PostgreSQL, Storage, and the
    # import worker. A static login page can be healthy while imports are broken.
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 10s
    retries: 6
    start_period: 40s
  mem_limit: 1500m
  stop_grace_period: 5m
  networks: [internal]

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL - the actual product. Everything else is replaceable.
  # ─────────────────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:${POSTGRES_IMAGE_TAG}
    container_name: prospect-db
    <<: [*default-restart]
    logging: *default-logging
    # config_file MUST come first and MUST point at the image's own conf.
    #
    # Without it PostgreSQL falls back to the file initdb generated inside
    # PGDATA, which sets listen_addresses='localhost' and an empty
    # shared_preload_libraries. The container then starts, reports healthy, and
    # accepts psql over its own loopback - while every other service in the
    # stack gets "connection refused", and pgsodium/supabase_vault/pg_cron/
    # pg_net are silently absent.
    #
    # The -c flags after it are our tuning; a command-line -c beats the file, so
    # we inherit Supabase's baseline and override only what we mean to.
    # Sized for 8 GB total RAM shared with the rest of this stack.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - default_statistics_target=200
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=2000
      # JIT costs more than it saves on short queries with 2 vCPU.
      - -c
      - jit=off
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=2000
      - -c
      - timezone=UTC
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only when the data directory is empty.
      - ./postgres/init/00-prospect-bootstrap.sh:/docker-entrypoint-initdb.d/zz-00-prospect-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      # Local-only. Reach it from your laptop over the Tailscale/SSH tunnel:
      #   ssh -N -L 5432:127.0.0.1:5432 deploy@your-vps
      - "127.0.0.1:5432:5432"
    shm_size: 512mb
    stop_grace_period: 60s
    networks: [internal]

  # ─────────────────────────────────────────────────────────────────────────
  # GoTrue - email/password auth. This is the ONLY Supabase service that the
  # browser talks to directly (see deploy/README.md § "Why the API is safe").
  # ─────────────────────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:${GOTRUE_IMAGE_TAG}
    container_name: prospect-auth
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${APP_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_PUBLIC_URL},${APP_PUBLIC_URL}/**

      # Internal app: nobody self-registers. You create users in Studio.
      GOTRUE_DISABLE_SIGNUP: "true"

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}

      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"

      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_RATE_LIMIT_VERIFY: "30"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "10"

      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  # ─────────────────────────────────────────────────────────────────────────
  # PostgREST - the Data API. Prospect Sync reaches this ONLY from its server
  # routes using the service-role key; Caddy blocks it from the public internet.
  # ─────────────────────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:${POSTGREST_IMAGE_TAG}
    container_name: prospect-rest
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      # 2 vCPU box: a big pool just causes context-switch thrash.
      PGRST_DB_POOL: "15"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: error
    command: ["postgrest"]
    networks: [internal]

  # ─────────────────────────────────────────────────────────────────────────
  # postgres-meta + Studio - admin UI. NEVER exposed publicly; Caddy serves it
  # on a separate hostname behind basic auth, and ideally only over Tailscale.
  # ─────────────────────────────────────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:${POSTGRES_META_IMAGE_TAG}
    container_name: prospect-meta
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [internal]

  studio:
    image: supabase/studio:${STUDIO_IMAGE_TAG}
    container_name: prospect-studio
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      - meta
      - rest
    environment:
      # Docker sets HOSTNAME to the container ID by default, and Studio's
      # entrypoint binds Next.js to it (next start -H "$HOSTNAME"). That means
      # the server only listens on the container's bridge IP -- not loopback
      # -- so the image's own healthcheck (fetch to localhost:3000) always
      # fails with ECONNREFUSED even though every real request through the
      # bridge network works fine. Same fix as the app service's HOSTNAME
      # below: force it to bind everywhere.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_ORG_NAME}
      DEFAULT_PROJECT_NAME: ${STUDIO_PROJECT_NAME}
      # Not rest:3000 directly: Studio's own backend uses this one base URL to
      # reach both PostgREST (/rest/v1) and GoTrue (/auth/v1 -- Authentication
      # > Users needs this), and only Caddy serves both paths. The request
      # stays on the Docker bridge: api.clearroadco.link is a network alias
      # for the caddy container (see the caddy service below), so this never
      # leaves the host despite looking like a public URL.
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Logflare/analytics is not deployed - keep the Logs pages hidden.
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    networks: [internal]

  # ─────────────────────────────────────────────────────────────────────────
  # Prospect Sync (Next.js). Image is built by GitHub Actions and pulled here.
  # ─────────────────────────────────────────────────────────────────────────
  # Blue/green slots. update.sh explicitly starts the inactive service, waits
  # for its backend-aware healthcheck, atomically reloads Caddy, and only then
  # stops the old slot. A normal compose startup leaves both slots alone.
  app-blue:
    <<: *app
    profiles: ["app-blue"]
    container_name: prospect-app-blue

  app-green:
    <<: *app
    profiles: ["app-green"]
    container_name: prospect-app-green

  # One job at a time protects interactive traffic on the 2-vCPU VPS.
  import-worker:
    image: ${APP_IMAGE}
    container_name: prospect-import-worker
    <<: [*default-restart]
    logging: *default-logging
    command: ["node", "worker/import-worker.mjs"]
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
      storage: { condition: service_started }
      app-router: { condition: service_started }
    environment:
      NODE_ENV: production
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_REST_URL: http://rest:3000
      SUPABASE_STORAGE_URL: http://storage:5000
      IMPORT_APP_URL: http://app-router:3000
      IMPORT_BATCH_SIZE: "1000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: authenticator
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NODE_OPTIONS: "--max-old-space-size=512"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 768m
    cpus: "1.0"
    stop_grace_period: 30s
    networks: [internal]

  # Stable internal proxy between the public Caddy listener and the two app
  # slots. Its configuration reload is graceful, so ports 80/443 and existing
  # public connections are never bounced during an application release.
  app-router:
    image: caddy:${CADDY_IMAGE_TAG}
    container_name: prospect-app-router
    <<: [*default-restart]
    logging: *default-logging
    volumes:
      - ./caddy/AppRouter.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      internal:
        aliases:
          # Compatibility for the first deployment from the former app service.
          - app

  # ─────────────────────────────────────────────────────────────────────────
  # Caddy - TLS, HTTP routing, and the public/private boundary.
  # This replaces Supabase's Kong gateway: one less service, one less config
  # file, and the routing rules live next to the TLS config.
  # ─────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:${CADDY_IMAGE_TAG}
    container_name: prospect-caddy
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      - app-router
      - auth
      - rest
      - studio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      STUDIO_BASIC_AUTH_USER: ${STUDIO_BASIC_AUTH_USER}
      STUDIO_BASIC_AUTH_HASH: ${STUDIO_BASIC_AUTH_HASH}
      STUDIO_BASIC_AUTH_USER_2: ${STUDIO_BASIC_AUTH_USER_2}
      STUDIO_BASIC_AUTH_HASH_2: ${STUDIO_BASIC_AUTH_HASH_2}
      STUDIO_ALLOWED_CIDRS: "${STUDIO_ALLOWED_CIDRS:-100.64.0.0/10 127.0.0.1/32 ::1}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        aliases:
          # Lets containers resolve the public API hostname without leaving the
          # box. Server-side Supabase calls stay on the Docker bridge.
          - ${API_DOMAIN}

  # ═════════════════════════════════════════════════════════════════════════
  # OPTIONAL - enable via COMPOSE_PROFILES in .env
  # ═════════════════════════════════════════════════════════════════════════

  storage:
    image: supabase/storage-api:${STORAGE_IMAGE_TAG}
    container_name: prospect-storage
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGREST_URL: http://rest:3000
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "1073741824"
      UPLOAD_FILE_SIZE_LIMIT: "1073741824"
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: "52428800"
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: "300"
      TUS_URL_PATH: /upload/resumable
      TUS_URL_EXPIRY_MS: "86400000"
      TUS_MAX_CONCURRENT_UPLOADS: "4"
      TUS_PART_SIZE: "6"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: prospect
      REGION: local
      GLOBAL_S3_BUCKET: prospect
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    networks: [internal]

  imgproxy:
    profiles: ["storage"]
    image: darthsim/imgproxy:${IMGPROXY_IMAGE_TAG}
    container_name: prospect-imgproxy
    <<: [*default-restart]
    logging: *default-logging
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage
    networks: [internal]

  realtime:
    profiles: ["realtime"]
    image: supabase/realtime:${REALTIME_IMAGE_TAG}
    container_name: prospect-realtime
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    networks: [internal]

  functions:
    profiles: ["functions"]
    image: supabase/edge-runtime:${EDGE_RUNTIME_IMAGE_TAG}
    container_name: prospect-functions
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      # Same fix as studio's SUPABASE_URL above: rest:3000 has no /auth/v1, so
      # a function using the JS client's auth admin methods would 404. The
      # Caddy alias serves both paths without leaving the Docker bridge.
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VERIFY_JWT: "true"
    volumes:
      - ./functions:/home/deno/functions:ro
    command: ["start", "--main-service", "/home/deno/functions/main"]
    networks: [internal]

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
